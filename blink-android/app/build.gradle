plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blink.buddy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.blink.buddy'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '0.6'

        // The Cactus runtime ships for 64-bit ARM, which nearly every current Android phone uses.
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Permanent signing key, so every new build installs over the old one.
    // The CI build writes it from the SWEETY_KEYSTORE_B64 / SWEETY_KEY_PASSWORD repository secrets.
    def sweetyKeystore = System.getenv('SWEETY_KEYSTORE')
    def sweetyPassword = System.getenv('SWEETY_KEY_PASSWORD')
    signingConfigs {
        sweety {
            if (sweetyKeystore && sweetyPassword) {
                storeFile file(sweetyKeystore)
                storePassword sweetyPassword
                keyAlias 'sweety'
                keyPassword sweetyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (sweetyKeystore && sweetyPassword) signingConfig signingConfigs.sweety
        }
        release {
            minifyEnabled false
        }
    }

    // Floating Blink renders the same 3D character as the desktop and web versions.
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../blink-mobile/vendor', '../../blink-mobile/src']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    // Google's on-device LLM runtime; runs Sweety's chat brain (Qwen3-0.6B, downloaded in the app).
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.1'
}
