plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blink.buddy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.blink.buddy'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Floating Blink renders the same 3D character as the desktop and web versions.
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../blink-mobile/vendor', '../../blink-mobile/src']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
