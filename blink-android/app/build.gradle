plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blink.buddy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.blink.buddy'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.0'

        // The Cactus runtime ships for 64-bit ARM, which nearly every current Android phone uses.
        // CI emulator tests can build for x86_64 with -PsweetyAbi=x86_64.
        ndk { abiFilters(project.findProperty('sweetyAbi') ?: 'arm64-v8a') }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Permanent signing key, so every new build installs over the old one.
    // The CI build writes it from the SWEETY_KEYSTORE_B64 / SWEETY_KEY_PASSWORD repository secrets.
    def sweetyKeystore = System.getenv('SWEETY_KEYSTORE')
    def sweetyPassword = System.getenv('SWEETY_KEY_PASSWORD')
    signingConfigs {
        sweety {
            if (sweetyKeystore && sweetyPassword) {
                storeFile file(sweetyKeystore)
                storePassword sweetyPassword
                keyAlias 'sweety'
                keyPassword sweetyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (sweetyKeystore && sweetyPassword) signingConfig signingConfigs.sweety
        }
        release {
            minifyEnabled false
        }
    }

    // Floating Blink renders the same 3D character as the desktop and web versions.
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../blink-mobile/vendor', '../../blink-mobile/src']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            // Only arm64 (phones) and x86_64 (CI emulator) are shipped; sherpa-onnx's 32-bit x86 build carries its own
            // libonnxruntime.so, which would clash with onnxruntime-android's (Hey Sweety model).
            excludes += ['lib/x86/**', 'lib/armeabi-v7a/**']
        }
    }
}

dependencies {
    // Google's on-device LLM runtime; runs Sweety's chat brain (Qwen3-0.6B, downloaded in the app).
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.1'
    // sherpa-onnx (Apache-2.0): the "Hey Sweety" wake-word detector and her natural Kokoro voice.
    // CI downloads the release AAR into app/libs (see .github/workflows/android.yml).
    implementation files('libs/sherpa-onnx.aar')
    // Runs Sweety's own "Hey Sweety" model (assets/wake/, see wakeword/train.py)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
