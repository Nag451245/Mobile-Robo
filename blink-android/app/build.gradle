plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blink.buddy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.blink.buddy'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3'

        // Needle 2 ships for 64-bit ARM, which nearly every current Android phone uses.
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Floating Blink renders the same 3D character as the desktop and web versions.
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../blink-mobile/vendor', '../../blink-mobile/src']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
