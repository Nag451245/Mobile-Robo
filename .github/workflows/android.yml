name: Android live wallpaper (APK)

# Every build is tested before it is published:
#   host-tests  wake phrase + command routing rules, and the real Whistle / Needle 3 models on recorded speech
#   emulator    the real APK on Android 11 and 14 emulators: chat brain answers, "Hey Sweety" works in the background
#   publish     only from main, only when everything above passed
on:
  push:
    branches: [main, 'test/**']
    paths: ['blink-android/**', 'blink-mobile/src/**', 'blink-mobile/vendor/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  CACTUS: https://huggingface.co/Cactus-Compute/cactus/resolve/main/releases/4.1.4
  HF: https://huggingface.co/Cactus-Compute
  QWEN_URL: https://huggingface.co/litert-community/Qwen3-0.6B-int4/resolve/main/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # LiteRT-LM ships Java 21 class files

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Sweety's offline brain, all by Cactus Compute (Apache-2.0):
      # Cactus 4 runtime + Needle 3 (understands requests, calls tools) + Whistle (speech to text).
      - name: Fetch Cactus runtime, Needle 3 and Whistle
        working-directory: blink-android/app
        run: |
          mkdir -p cactus/arm64-v8a src/main/assets
          curl -fsSL --retry 3 -o cactus/arm64-v8a/libcactus.a "$CACTUS/android-arm64/libcactus.a"
          curl -fsSL --retry 3 -o cactus/arm64-v8a/cactus.h "$CACTUS/android-arm64/cactus.h"
          curl -fsSL --retry 3 -o src/main/assets/needle3.cact "$HF/needle3/resolve/main/needle3.cact"
          curl -fsSL --retry 3 -o src/main/assets/whistle.cact "$HF/whistle/resolve/main/whistle.cact"
          curl -fsSL --retry 3 -o src/main/assets/CACTUS_LICENSE.txt "$HF/needle3/resolve/main/LICENSE"
          ls -la cactus/arm64-v8a src/main/assets

      - name: Use the permanent signing key (from repository secrets)
        env:
          KS: ${{ secrets.SWEETY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sweety.jks"
            echo "SWEETY_KEYSTORE=$RUNNER_TEMP/sweety.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent Sweety key."
          else
            echo "::warning::SWEETY_KEYSTORE_B64 secret not set; using a temporary key, so this APK will not install over older builds."
          fi

      - name: Build the APK
        working-directory: blink-android
        env:
          SWEETY_KEY_PASSWORD: ${{ secrets.SWEETY_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../Sweety.apk

      # Same app for the x86_64 emulator, in case it can't run arm64 apps (no Cactus there: chat brain and mic only).
      - name: Build the x86_64 test APK
        working-directory: blink-android
        run: |
          set -o pipefail
          gradle assembleDebug -PsweetyAbi=x86_64 --no-daemon --console=plain 2>&1 | tee build-x86.log
          cp app/build/outputs/apk/debug/app-debug.apk ../Sweety-x86_64.apk

      - name: Show compile errors
        if: failure()
        working-directory: blink-android
        run: |
          cat build.log build-x86.log 2>/dev/null | grep -E "error:|e: |FAILURE|What went wrong|undefined symbol|undefined reference|ld.lld|CMake Error" -A3 | head -n 120 | while IFS= read -r line; do echo "::error::$line"; done

      - uses: actions/upload-artifact@v4
        with:
          name: Sweety-apk
          path: |
            Sweety.apk
            Sweety-x86_64.apk

  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blink-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sox espeak-ng >/dev/null
          pip install -q piper-tts==1.2.0

      - name: Wake phrase and routing rules
        run: |
          mkdir -p ht
          curl -fsSL --retry 3 -o ht/json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          S=app/src/main/java/com/blink/buddy
          javac -d ht -cp ht/json.jar test/java/android/graphics/Color.java test/java/com/blink/buddy/HostTest.java \
            $S/WakePhrase.java $S/RuleBrain.java $S/Call.java $S/Skin.java
          mkdir -p logs
          set -o pipefail
          java -cp ht:ht/json.jar com.blink.buddy.HostTest 2>&1 | tee logs/1-rules.log

      - name: Record the test phrases (several voices, quiet and noisy)
        run: bash test/make_speech.sh test/wake_phrases.tsv speech

      - uses: actions/upload-artifact@v4
        with:
          name: test-speech
          path: |
            blink-android/speech/*.wav
            blink-android/speech/list.tsv

      - name: Build the Cactus test program (Linux build of the same runtime)
        id: harness
        continue-on-error: true
        run: |
          mkdir -p cx
          curl -fsSL --retry 3 -o cx/libcactus.a "$CACTUS/linux-x86_64/libcactus.a"
          curl -fsSL --retry 3 -o cx/cactus.h "$CACTUS/linux-x86_64/cactus.h"
          curl -fsSL --retry 3 -o cx/needle3.cact "$HF/needle3/resolve/main/needle3.cact"
          curl -fsSL --retry 3 -o cx/whistle.cact "$HF/whistle/resolve/main/whistle.cact"
          java -cp ht:ht/json.jar com.blink.buddy.HostTest tools > tools.json
          ls -la cx; file cx/libcactus.a; ar t cx/libcactus.a | head -5
          g++ -O2 -std=c++17 -Icx test/cactus_host.cpp -o cactus_host -Wl,--start-group cx/libcactus.a -Wl,--end-group -lpthread -ldl -lm -fopenmp > logs/2-gcc.log 2>&1 \
            || g++ -O2 -std=c++17 -Icx test/cactus_host.cpp -o cactus_host cx/libcactus.a -lpthread -ldl -lm -lcurl -fopenmp >> logs/2-gcc.log 2>&1 \
            || { grep -oE "undefined reference to .[^']+" logs/2-gcc.log | sort | uniq -c | sort -rn | head -40 > logs/2-gcc-missing.log; exit 1; }

      - name: Whistle hears the recordings, and "Hey Sweety" is found in them
        if: steps.harness.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./cactus_host hear cx/whistle.cact cx/needle3.cact speech/list.tsv 2>logs/3-hear-stderr.log | tee transcripts.tsv
          java -cp ht:ht/json.jar com.blink.buddy.HostTest transcripts.tsv 2>&1 | tee logs/3-hear.log

      - name: Needle 3 + rules send commands to actions and small talk to the chat brain
        if: steps.harness.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./cactus_host think cx/whistle.cact cx/needle3.cact test/routing.tsv 2>logs/4-think-stderr.log | tee needle.tsv
          java -cp ht:ht/json.jar com.blink.buddy.HostTest needle needle.tsv 2>&1 | tee logs/4-think.log

      - name: Post the results
        if: always()
        run: for f in logs/*.log; do bash test/annotate.sh notice "$(basename "$f")" "$f" 5000; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-test-results
          path: |
            blink-android/transcripts.tsv
            blink-android/needle.tsv

  emulator:
    needs: [build, host-tests]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sweety-apk

      - uses: actions/download-artifact@v4
        with:
          name: test-speech
          path: speech

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq sox >/dev/null

      - name: Chat brain model (cached)
        id: qwen
        uses: actions/cache@v4
        with:
          path: ~/qwen
          key: qwen3-0.6b-nothink-q4-ekv1280

      - name: Download the chat brain model
        if: steps.qwen.outputs.cache-hit != 'true'
        run: mkdir -p ~/qwen && curl -fsSL --retry 3 -o ~/qwen/chat.litertlm "$QWEN_URL" && ls -la ~/qwen

      - name: Run Sweety on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash blink-android/test/emulator_test.sh Sweety.apk Sweety-x86_64.apk $HOME/qwen/chat.litertlm speech emu-out

      - name: Post the results
        if: always()
        run: |
          bash blink-android/test/annotate.sh notice "api${{ matrix.api }} summary" emu-out/summary.txt 8000
          grep -E "/Sweety|FATAL|AndroidRuntime|litert" emu-out/logcat.txt | grep -v "mic: loudest" > emu-out/sweety-log.txt || true
          bash blink-android/test/annotate.sh notice "api${{ matrix.api }} sweety log" emu-out/sweety-log.txt 12000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api${{ matrix.api }}
          path: emu-out

  publish:
    needs: [build, host-tests, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sweety-apk

      - name: Publish to the "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: Sweety.apk
          body: |
            Built automatically from the main branch, after passing the host and Android emulator tests.

            **Phone (Android 8+, 64-bit):** open this page on your phone in Chrome, tap `Sweety.apk`, allow "Install unknown apps" for Chrome when asked, then open Sweety. If Play Protect says "Unsafe app blocked", tap More details > Install anyway.

            Sweety's offline brain is [Needle 3](https://huggingface.co/Cactus-Compute/needle3) and [Whistle](https://huggingface.co/Cactus-Compute/whistle) on the [Cactus runtime](https://huggingface.co/Cactus-Compute/cactus) by Cactus Compute (Apache-2.0).

            **Windows:** download `Blink-portable-win64.zip`, unzip anywhere and run `Blink.exe`. No installer or admin rights needed.
