name: Android live wallpaper (APK)

on:
  push:
    branches: [main]
    paths: ['blink-android/**', 'blink-mobile/src/**', 'blink-mobile/vendor/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Keeps the same signing key between builds, so a new APK installs over the old one.
      - name: Reuse the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: blink-debug-keystore-v1

      # Sweety's brain: Needle 2 by Cactus Compute (Apache-2.0), https://huggingface.co/Cactus-Compute/needle2
      - name: Fetch Needle 2
        working-directory: blink-android/app
        run: |
          base=https://huggingface.co/Cactus-Compute/needle2/resolve/main
          mkdir -p needle/arm64-v8a src/main/assets
          curl -fsSL --retry 3 -o needle/arm64-v8a/libneedle.a "$base/android-arm64/libneedle.a"
          curl -fsSL --retry 3 -o needle/arm64-v8a/needle.h "$base/android-arm64/needle.h"
          curl -fsSL --retry 3 -o src/main/assets/needle2.cact "$base/needle2.cact"
          curl -fsSL --retry 3 -o src/main/assets/NEEDLE_LICENSE.txt "$base/LICENSE"
          ls -la needle/arm64-v8a src/main/assets

      - name: Build the APK
        working-directory: blink-android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        working-directory: blink-android
        run: |
          grep -E "error:|e: |FAILURE|What went wrong|undefined symbol|undefined reference|ld.lld|CMake Error" -A3 build.log | head -n 120 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Name the APK
        run: cp blink-android/app/build/outputs/apk/debug/app-debug.apk Sweety.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sweety-apk
          path: Sweety.apk

      - name: Publish to the "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: Sweety.apk
          body: |
            Built automatically from the main branch.

            **Phone (Android 8+, 64-bit):** open this page on your phone in Chrome, tap `Sweety.apk`, allow "Install unknown apps" for Chrome when asked, then open Sweety. If Play Protect says "Unsafe app blocked", tap More details > Install anyway.

            Sweety's offline brain is [Needle 2](https://huggingface.co/Cactus-Compute/needle2) by Cactus Compute (Apache-2.0).

            **Windows:** download `Blink-portable-win64.zip`, unzip anywhere and run `Blink.exe`. No installer or admin rights needed.
