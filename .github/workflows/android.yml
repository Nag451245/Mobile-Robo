name: Android live wallpaper (APK)

# Every build is tested before it is published:
#   host-tests  routing rules, Whistle / Needle 3 on recorded speech, the "Hey Sweety" wake-word detector on realistic
#               phone-mic audio and ordinary chatter, the natural voice, and the Gemini brain against a stand-in server
#   emulator    the real APK on Android 11 and 14 emulators: answers, actions and memory, natural voice, wake word ->
#               talk card, "Hey Sweety" in the background
#   publish     only from main, only when everything above passed
on:
  push:
    branches: [main, 'test/**']
    paths: ['blink-android/**', '!blink-android/wakeword/**', 'blink-mobile/src/**', 'blink-mobile/vendor/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  # A newer push to a test branch replaces the older test run; main builds always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CACTUS: https://huggingface.co/Cactus-Compute/cactus/resolve/main/releases/4.1.4
  HF: https://huggingface.co/Cactus-Compute
  QWEN_URL: https://huggingface.co/litert-community/Qwen3-0.6B-int4/resolve/main/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm
  # sherpa-onnx (Apache-2.0): the wake-word detector and the Kokoro natural voice
  SHERPA_VER: v2.0.1
  KWS_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
  KWS_DIR: sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
  KOKORO_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-en-v0_19.tar.bz2
  # sherpa-onnx 2 reads words from a pronunciation dictionary (no espeak-ng any more)
  KOKORO_LEXICON_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/lexicon-en-us.txt
  # Sweety's own wake-word model, published by .github/workflows/wakeword.yml
  WAKE_MODEL_URL: https://github.com/Nag451245/Mobile-Robo/releases/download/hey-sweety-model
  BUDDY_MODEL_URL: https://github.com/Nag451245/Mobile-Robo/releases/download/hey-buddy-model

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # LiteRT-LM ships Java 21 class files

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the avatar page (three.js + three-vrm, MIT)
        working-directory: blink-android/avatar
        run: |
          npm ci --no-audit --no-fund
          npm run build
          ls -la ../app/src/main/assets/avatar

      - name: Fetch sherpa-onnx and the "Hey Sweety" wake-word model
        working-directory: blink-android/app
        run: |
          mkdir -p libs src/main/assets/kws
          curl -fsSL --retry 3 -o libs/sherpa-onnx.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/$SHERPA_VER/sherpa-onnx-static-link-onnxruntime-${SHERPA_VER#v}.aar"
          curl -fsSL --retry 3 "$KWS_URL" | tar -xj -C "$RUNNER_TEMP"
          pip install -q sentencepiece==0.2.0 numpy
          python ../test/kws.py prepare "$RUNNER_TEMP/$KWS_DIR" src/main/assets/kws
          ls -la libs src/main/assets/kws

      - name: Speech features for Voice Match, and Sweety's own "Hey Sweety" model if it's good enough
        working-directory: blink-android/app
        run: |
          mkdir -p src/main/assets/wake
          # The shared speech-feature models (openWakeWord / Google speech_embedding, Apache-2.0): always shipped,
          # Voice Match runs on them. Published with the trained model by wakeword.yml.
          for f in melspectrogram.onnx embedding_model.onnx; do
            curl -fsSL --retry 3 -o "src/main/assets/wake/$f" "$WAKE_MODEL_URL/$f"
          done
          # The trained model ships only if its report says it's good enough (wakes on most clips, under 2 false
          # wake-ups an hour); otherwise the keyword spotter is the general detector.
          if curl -fsSL --retry 3 -o metrics.json "$WAKE_MODEL_URL/metrics.json" && python ../wakeword/good_enough.py metrics.json; then
            mv metrics.json src/main/assets/wake/
            curl -fsSL --retry 3 -o src/main/assets/wake/hey_sweety.onnx "$WAKE_MODEL_URL/hey_sweety.onnx"
          else
            echo "::warning::the trained Hey Sweety model isn't good enough yet; the app keeps the keyword spotter (plus Voice Match)"
            rm -f metrics.json
          fi
          # "Hey Buddy", the second wake word: its own model, same gate (until it exists, Voice Match covers it).
          if curl -fsSL --retry 3 -o buddy.json "$BUDDY_MODEL_URL/metrics.json" && python ../wakeword/good_enough.py buddy.json; then
            mv buddy.json src/main/assets/wake/hey_buddy.json
            curl -fsSL --retry 3 -o src/main/assets/wake/hey_buddy.onnx "$BUDDY_MODEL_URL/hey_buddy.onnx"
          else
            echo "::notice::no Hey Buddy model good enough to ship yet; Hey Buddy works through Voice Match"
            rm -f buddy.json
          fi
          ls -la src/main/assets/wake

      - name: Natural voice model (cached)
        id: kokoro
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-int8-en-v0_19-lexicon

      - name: Package the natural voice for download (Kokoro, Apache-2.0)
        run: |
          if [ ! -f ~/kokoro/model.int8.onnx ] && [ ! -f ~/kokoro/model.onnx ]; then
            mkdir -p ~/kokoro && curl -fsSL --retry 3 "$KOKORO_URL" | tar -xj -C ~/kokoro --strip-components=1
          fi
          [ -f ~/kokoro/lexicon-en-us.txt ] || curl -fsSL --retry 3 -o ~/kokoro/lexicon-en-us.txt "$KOKORO_LEXICON_URL"
          ls -la ~/kokoro
          (cd ~/kokoro && zip -qr "$GITHUB_WORKSPACE/sweety-voice-kokoro.zip" . -x "espeak-ng-data/*")
          ls -la sweety-voice-kokoro.zip

      # Sweety's offline brain, all by Cactus Compute (Apache-2.0):
      # Cactus 4 runtime + Needle 3 (understands requests, calls tools) + Whistle (speech to text).
      - name: Fetch Cactus runtime, Needle 3 and Whistle
        working-directory: blink-android/app
        run: |
          mkdir -p cactus/arm64-v8a src/main/assets
          curl -fsSL --retry 3 -o cactus/arm64-v8a/libcactus.a "$CACTUS/android-arm64/libcactus.a"
          curl -fsSL --retry 3 -o cactus/arm64-v8a/cactus.h "$CACTUS/android-arm64/cactus.h"
          curl -fsSL --retry 3 -o src/main/assets/needle3.cact "$HF/needle3/resolve/main/needle3.cact"
          curl -fsSL --retry 3 -o src/main/assets/whistle.cact "$HF/whistle/resolve/main/whistle.cact"
          curl -fsSL --retry 3 -o src/main/assets/CACTUS_LICENSE.txt "$HF/needle3/resolve/main/LICENSE"
          ls -la cactus/arm64-v8a src/main/assets

      - name: Use the permanent signing key (from repository secrets)
        env:
          KS: ${{ secrets.SWEETY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sweety.jks"
            echo "SWEETY_KEYSTORE=$RUNNER_TEMP/sweety.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent Sweety key."
          else
            echo "::warning::SWEETY_KEYSTORE_B64 secret not set; using a temporary key, so this APK will not install over older builds."
          fi

      - name: Build the APK
        working-directory: blink-android
        env:
          SWEETY_KEY_PASSWORD: ${{ secrets.SWEETY_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../Sweety.apk

      # Same app for the x86_64 emulator, in case it can't run arm64 apps (no Cactus there: chat brain and mic only).
      - name: Build the x86_64 test APK
        working-directory: blink-android
        run: |
          set -o pipefail
          gradle assembleDebug -PsweetyAbi=x86_64 --no-daemon --console=plain 2>&1 | tee build-x86.log
          cp app/build/outputs/apk/debug/app-debug.apk ../Sweety-x86_64.apk

      - name: Show compile errors
        if: failure()
        working-directory: blink-android
        run: |
          # One annotation with the whole story (GitHub shows only 10 annotations per step)
          { grep -h -E "error:|e: |undefined symbol|undefined reference|ld.lld|CMake Error" -A3 build.log build-x86.log 2>/dev/null | head -n 60
            grep -h "What went wrong" -A25 build.log build-x86.log 2>/dev/null | head -n 60; } > errors.txt
          bash test/annotate.sh error "why the build failed" errors.txt 7000

      - uses: actions/upload-artifact@v4
        with:
          name: Sweety-apk
          path: |
            Sweety.apk
            Sweety-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sweety-voice
          path: sweety-voice-kokoro.zip
          compression-level: 0

  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blink-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sox espeak-ng >/dev/null
          pip install -q piper-tts==1.2.0 sherpa-onnx==${SHERPA_VER#v} sentencepiece==0.2.0 numpy

      - name: Wake phrase and routing rules
        run: |
          mkdir -p ht
          curl -fsSL --retry 3 -o ht/json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          S=app/src/main/java/com/blink/buddy
          javac -d ht -cp ht/json.jar test/java/android/graphics/Color.java test/java/com/blink/buddy/HostTest.java \
            $S/WakePhrase.java $S/RuleBrain.java $S/Call.java $S/Skin.java $S/DayTime.java $S/Fresh.java $S/SpeakText.java $S/Critter.java $S/GeminiBrain.java $S/Conversation.java
          mkdir -p logs
          set -o pipefail
          java -cp ht:ht/json.jar com.blink.buddy.HostTest 2>&1 | tee logs/1-rules.log

      - name: Gemini brain against a stand-in server (answers, actions, memory, wrong key)
        run: |
          set -o pipefail
          python test/mock_gemini.py 8089 mocklog &
          sleep 2
          java -cp ht:ht/json.jar com.blink.buddy.HostTest gemini http://127.0.0.1:8089 2>&1 | tee logs/5-gemini.log

      - name: Record the test phrases (several voices, quiet, noisy, phone mic, and ordinary chatter)
        run: bash test/make_speech.sh test/wake_phrases.tsv speech

      - name: Wake-word detector on the recordings (clearly spoken ones wake her, ordinary speech never)
        run: |
          set -o pipefail
          curl -fsSL --retry 3 "$KWS_URL" | tar -xj -C "$RUNNER_TEMP"
          python test/kws.py prepare "$RUNNER_TEMP/$KWS_DIR" kws > /dev/null
          # The app uses Sweety's own trained model when it exists (same files the build puts in assets/wake), else the spotter.
          mkdir -p wake; for f in hey_sweety.onnx metrics.json melspectrogram.onnx embedding_model.onnx; do curl -fsSL --retry 3 -o "wake/$f" "$WAKE_MODEL_URL/$f" || { rm -rf wake; break; }; done
          [ -f wake/metrics.json ] && ! python wakeword/good_enough.py wake/metrics.json && rm -rf wake  # same gate as the build
          if [ -f wake/hey_sweety.onnx ]; then
            python test/wake.py test wake speech/list.tsv speech/long_negative.wav 2>&1 | tee logs/6-wakeword.log
          else
            python test/kws.py test kws speech/list.tsv speech/long_negative.wav 2>&1 | tee logs/6-wakeword.log
          fi
          # Hey Buddy, once its model ships: its own recordings ("Hey Buddy..." must wake her, "somebody", "my buddy"... never)
          mkdir -p wakeb; for f in hey_buddy.onnx metrics.json melspectrogram.onnx embedding_model.onnx; do curl -fsSL --retry 3 -o "wakeb/$f" "$BUDDY_MODEL_URL/$f" 2>/dev/null || { rm -rf wakeb; break; }; done
          [ -f wakeb/metrics.json ] && ! python wakeword/good_enough.py wakeb/metrics.json && rm -rf wakeb
          if [ -f wakeb/hey_buddy.onnx ]; then
            bash test/make_speech.sh test/wake_phrases_buddy.tsv speech_buddy > /dev/null
            WAKE_NAME=hey_buddy python test/wake.py test wakeb speech_buddy/list.tsv speech/long_negative.wav 2>&1 | tee logs/6b-wakeword-buddy.log
          fi

      - name: Natural voice model (cached)
        if: always()
        id: kokoro
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-int8-en-v0_19-lexicon

      - name: Natural voice speaks (every voice the app offers)
        if: always()
        run: |
          set -o pipefail
          if [ ! -f ~/kokoro/model.int8.onnx ] && [ ! -f ~/kokoro/model.onnx ]; then
            mkdir -p ~/kokoro && curl -fsSL --retry 3 "$KOKORO_URL" | tar -xj -C ~/kokoro --strip-components=1
          fi
          [ -f ~/kokoro/lexicon-en-us.txt ] || curl -fsSL --retry 3 -o ~/kokoro/lexicon-en-us.txt "$KOKORO_LEXICON_URL"
          # Sweety's own word list (her name, "or", "her" and so on), the same one the app writes next to the dictionary
          java -cp ht:ht/json.jar com.blink.buddy.HostTest lexicon ~/kokoro/sweety-words.txt
          # every line she says must be words the voice knows, or it silently skips them
          java -cp ht:ht/json.jar com.blink.buddy.HostTest speakable ~/kokoro/lexicon-en-us.txt 2>&1 | tee logs/7a-speakable.log
          python test/voice.py ~/kokoro voice-samples 2>&1 | tee logs/7-voice.log
          if grep -q "OOV word skipped" logs/7-voice.log; then echo "FAIL  the voice skipped words: $(grep -o "OOV word skipped.*" logs/7-voice.log | sort -u | tr '\n' ' ')"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-samples
          path: blink-android/voice-samples

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-speech
          path: |
            blink-android/speech/*.wav
            blink-android/speech/list.tsv
            blink-android/speech/detected.txt

      - name: Build the Cactus test program (Linux build of the same runtime)
        id: harness
        continue-on-error: true
        run: |
          mkdir -p cx
          curl -fsSL --retry 3 -o cx/libcactus.a "$CACTUS/linux-x86_64/libcactus.a"
          curl -fsSL --retry 3 -o cx/cactus.h "$CACTUS/linux-x86_64/cactus.h"
          curl -fsSL --retry 3 -o cx/needle3.cact "$HF/needle3/resolve/main/needle3.cact"
          curl -fsSL --retry 3 -o cx/whistle.cact "$HF/whistle/resolve/main/whistle.cact"
          java -cp ht:ht/json.jar com.blink.buddy.HostTest tools > tools.json
          # libcactus.a is built with clang's libc++ (std::__1), so link with that.
          sudo apt-get install -y -qq clang libc++-dev libc++abi-dev libomp-dev >/dev/null
          clang++ -O2 -std=c++17 -stdlib=libc++ -Icx test/cactus_host.cpp -o cactus_host cx/libcactus.a -lc++abi -lpthread -ldl -lm > logs/2-build.log 2>&1 \
            || clang++ -O2 -std=c++17 -stdlib=libc++ -Icx test/cactus_host.cpp -o cactus_host cx/libcactus.a -lc++abi -lpthread -ldl -lm -fopenmp -lcurl >> logs/2-build.log 2>&1 \
            || { grep -oE "undefined reference to .[^']+" logs/2-build.log | sort | uniq -c | sort -rn | head -40 > logs/2-build-missing.log; exit 1; }

      - name: Whistle hears the recordings, and "Hey Sweety" is found in them
        if: steps.harness.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          # Without and with the keyword hint the phone gives Whistle (her name); the phone uses the hint.
          ./cactus_host hear cx/whistle.cact cx/needle3.cact speech/list.tsv "" 2>logs/3a-hear-stderr.log > transcripts-nohint.tsv
          java -cp ht:ht/json.jar com.blink.buddy.HostTest transcripts-nohint.tsv > logs/3a-hear-nohint.log 2>&1 || true
          ./cactus_host hear cx/whistle.cact cx/needle3.cact speech/list.tsv Sweety 2>logs/3b-hear-stderr.log > transcripts.tsv
          java -cp ht:ht/json.jar com.blink.buddy.HostTest transcripts.tsv 2>&1 | tee logs/3b-hear-hint.log

      - name: Needle 3 + rules send commands to actions and small talk to the chat brain
        if: steps.harness.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./cactus_host think cx/whistle.cact cx/needle3.cact test/routing.tsv 2>logs/4-think-stderr.log | tee needle.tsv
          java -cp ht:ht/json.jar com.blink.buddy.HostTest needle needle.tsv 2>&1 | tee logs/4-think.log

      - name: Post the results
        if: always()
        run: for f in logs/*.log; do bash test/annotate.sh notice "$(basename "$f")" "$f" 5000; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-test-results
          path: |
            blink-android/transcripts.tsv
            blink-android/transcripts-nohint.tsv
            blink-android/needle.tsv

  emulator:
    needs: [build, host-tests]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Three emulators side by side: the app on Android 11 and 14 (phase A), and the real arm64 phone build
        # under ARM translation (phase B, slow, so it gets its own machine instead of running after phase A).
        include:
          - {api: 30, phase: A}
          - {api: 34, phase: A}
          - {api: 34, phase: B}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sweety-apk

      - uses: actions/download-artifact@v4
        with:
          name: test-speech
          path: speech

      - uses: actions/download-artifact@v4
        with:
          name: sweety-voice

      - name: Unpack the natural voice, fetch a sample VRM character, start the stand-in Gemini server
        run: |
          mkdir -p voice && unzip -q sweety-voice-kokoro.zip -d voice && ls voice
          # Seed-san: the VRM consortium's sample avatar (VRM Public License 1.0, (c) pixiv), used only in this test
          mkdir -p vrm && curl -fsSL --retry 3 -o vrm/sample.vrm https://raw.githubusercontent.com/vrm-c/vrm-specification/master/samples/Seed-san/vrm/Seed-san.vrm
          nohup python3 blink-android/test/mock_gemini.py 8089 "$PWD/mocklog" > mock.out 2>&1 &
          sleep 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq sox >/dev/null

      - name: Chat brain model (cached)
        id: qwen
        uses: actions/cache@v4
        with:
          path: ~/qwen
          key: qwen3-0.6b-nothink-q4-ekv1280

      - name: Download the chat brain model
        if: steps.qwen.outputs.cache-hit != 'true'
        run: mkdir -p ~/qwen && curl -fsSL --retry 3 -o ~/qwen/chat.litertlm "$QWEN_URL" && ls -la ~/qwen

      - name: Run Sweety on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: PHASES=${{ matrix.phase }} timeout -k 60 1500 bash blink-android/test/emulator_test.sh Sweety.apk Sweety-x86_64.apk $HOME/qwen/chat.litertlm speech emu-out $PWD/voice 8089 $PWD/mocklog $PWD/vrm/sample.vrm

      - name: Post the results
        if: always()
        run: |
          bash blink-android/test/annotate.sh notice "api${{ matrix.api }}-${{ matrix.phase }} summary" emu-out/summary.txt 8000
          grep -E "/Sweety|FATAL|AndroidRuntime" emu-out/logcat.txt | grep -vE "mic: loudest|needle3: " > emu-out/sweety-log.txt || true
          bash blink-android/test/annotate.sh notice "api${{ matrix.api }}-${{ matrix.phase }} sweety log" emu-out/sweety-log.txt 12000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api${{ matrix.api }}-${{ matrix.phase }}
          path: emu-out

  publish:
    needs: [build, host-tests, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sweety-apk

      - uses: actions/download-artifact@v4
        with:
          name: sweety-voice

      - name: Publish to the "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: |
            Sweety.apk
            sweety-voice-kokoro.zip
          body: |
            Built automatically from the main branch, after passing the host and Android emulator tests.

            **Phone (Android 8+, 64-bit):** open this page on your phone in Chrome, tap `Sweety.apk`, allow "Install unknown apps" for Chrome when asked, then open Sweety. If Play Protect says "Unsafe app blocked", tap More details > Install anyway.

            `sweety-voice-kokoro.zip` is Sweety's natural voice; the app downloads it for you (Download natural voice). It is [Kokoro](https://huggingface.co/hexgrad/Kokoro-82M) (Apache-2.0) packaged by [sherpa-onnx](https://github.com/k2-fsa/sherpa-onnx), with espeak-ng data (GPL-3.0).

            Sweety's offline brain is [Needle 3](https://huggingface.co/Cactus-Compute/needle3) and [Whistle](https://huggingface.co/Cactus-Compute/whistle) on the [Cactus runtime](https://huggingface.co/Cactus-Compute/cactus) by Cactus Compute (Apache-2.0).

            **Windows:** download `Blink-portable-win64.zip`, unzip anywhere and run `Blink.exe`. No installer or admin rights needed.
