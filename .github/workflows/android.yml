name: Android live wallpaper (APK)

on:
  push:
    branches: [main]
    paths: ['blink-android/**', 'blink-mobile/src/**', 'blink-mobile/vendor/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Sweety's offline brain, all by Cactus Compute (Apache-2.0):
      # Cactus 4 runtime + Needle 3 (understands requests, calls tools) + Whistle (speech to text).
      - name: Fetch Cactus runtime, Needle 3 and Whistle
        working-directory: blink-android/app
        run: |
          hf=https://huggingface.co/Cactus-Compute
          mkdir -p cactus/arm64-v8a src/main/assets
          curl -fsSL --retry 3 -o cactus/arm64-v8a/libcactus.a "$hf/cactus/resolve/main/releases/4.1.4/android-arm64/libcactus.a"
          curl -fsSL --retry 3 -o cactus/arm64-v8a/cactus.h "$hf/cactus/resolve/main/releases/4.1.4/android-arm64/cactus.h"
          curl -fsSL --retry 3 -o src/main/assets/needle3.cact "$hf/needle3/resolve/main/needle3.cact"
          curl -fsSL --retry 3 -o src/main/assets/whistle.cact "$hf/whistle/resolve/main/whistle.cact"
          curl -fsSL --retry 3 -o src/main/assets/CACTUS_LICENSE.txt "$hf/needle3/resolve/main/LICENSE"
          ls -la cactus/arm64-v8a src/main/assets

      - name: Use the permanent signing key (from repository secrets)
        env:
          KS: ${{ secrets.SWEETY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sweety.jks"
            echo "SWEETY_KEYSTORE=$RUNNER_TEMP/sweety.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent Sweety key."
          else
            echo "::warning::SWEETY_KEYSTORE_B64 secret not set; using a temporary key, so this APK will not install over older builds."
          fi

      - name: Build the APK
        working-directory: blink-android
        env:
          SWEETY_KEY_PASSWORD: ${{ secrets.SWEETY_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        working-directory: blink-android
        run: |
          grep -E "error:|e: |FAILURE|What went wrong|undefined symbol|undefined reference|ld.lld|CMake Error" -A3 build.log | head -n 120 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Name the APK
        run: cp blink-android/app/build/outputs/apk/debug/app-debug.apk Sweety.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sweety-apk
          path: Sweety.apk

      - name: Publish to the "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: Sweety.apk
          body: |
            Built automatically from the main branch.

            **Phone (Android 8+, 64-bit):** open this page on your phone in Chrome, tap `Sweety.apk`, allow "Install unknown apps" for Chrome when asked, then open Sweety. If Play Protect says "Unsafe app blocked", tap More details > Install anyway.

            Sweety's offline brain is [Needle 3](https://huggingface.co/Cactus-Compute/needle3) and [Whistle](https://huggingface.co/Cactus-Compute/whistle) on the [Cactus runtime](https://huggingface.co/Cactus-Compute/cactus) by Cactus Compute (Apache-2.0).

            **Windows:** download `Blink-portable-win64.zip`, unzip anywhere and run `Blink.exe`. No installer or admin rights needed.
