name: Mobile web app (GitHub Pages)

# Publishes Blink Pocket (the browser version) at https://<owner>.github.io/<repo>/
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['blink-mobile/**', '.github/workflows/mobile-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the single-file app
        working-directory: blink-mobile
        run: |
          node build.js
          mkdir -p ../site
          cp dist/blink-mobile.html ../site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
