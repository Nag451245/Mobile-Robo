name: Desktop portable zip (Windows)

on:
  push:
    branches: [main]
    paths: ['blink-desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and package
        working-directory: blink-desktop
        run: |
          npm ci
          npm run pack

      - name: Make the portable zip
        working-directory: blink-desktop
        run: |
          $d = "dist\Blink-win32-x64"
          Copy-Item README.txt $d -Force
          New-Item -ItemType File "$d\portable" -Force | Out-Null
          $k = "$d\resources\app.asar.unpacked\node_modules\koffi\build\koffi"
          if (Test-Path $k) { Get-ChildItem $k -Directory | Where-Object Name -ne 'win32_x64' | Remove-Item -Recurse -Force }
          Compress-Archive -Path "$d\*" -DestinationPath "..\Blink-portable-win64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Blink-portable-win64
          path: Blink-portable-win64.zip

      - name: Publish to the "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: Blink-portable-win64.zip
