<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Blink, your pocket robot. Tap anywhere and it flies there."></canvas>
    <div id="files" aria-label="Folders Blink can hide in"></div>
    <div id="bubble" class="bubble" role="status" aria-live="polite"></div>
  </div>
  <header class="top">
    <h1>Blink</h1>
    <span class="chip name" id="skinName">Bubblegum</span>
    <span class="grow"></span>
    <button class="chip" id="talkBtn" aria-pressed="true">Voice replies on</button>
  </header>
  <div id="live" hidden><i></i><span id="liveText">Listening…</span></div>
  <nav class="dock">
    <button class="dbtn l" id="outfitBtn" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7a2 2 0 1 1 2-2"/><path d="M12 7v1.5L3 15a1.5 1.5 0 0 0 1 2.7h16a1.5 1.5 0 0 0 1-2.7l-9-6.5"/></svg></span>Outfits</button>
    <button id="mic" type="button" aria-pressed="false" aria-label="Voice mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg><small id="micLabel">Tap to talk</small></button>
    <button class="dbtn r" id="actBtn" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.2L20 9l-4.4 3.8L17 19l-5-3-5 3 1.4-6.2L4 9l5.8-.8z"/></svg></span>Actions</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="outfitSheet" aria-label="Outfits">
    <div class="sh-h"><b>Outfits</b><button class="chip" id="autoBtn" type="button" aria-pressed="true">Auto change on</button></div>
    <div class="skins" id="skins"></div>
  </section>
  <section class="sheet" id="actSheet" aria-label="Actions">
    <div class="sh-h"><b>Actions</b><button class="chip" id="closeAct" type="button">Done</button></div>
    <div class="acts" id="acts"></div>
    <form class="cmd" id="cmdForm" autocomplete="off"><input id="cmdInput" placeholder="Type: dance, wear the kitty…" aria-label="Command for Blink"><button type="submit">Go</button></form>
    <p class="hint" id="voiceHint">Say: “dance”, “wear the bunny”, “tell me a joke”, “come here”, “hide in a folder”, “bigger”.</p>
  </section>
</div>
